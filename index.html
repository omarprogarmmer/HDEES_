<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="stylesheet" href="m_c.css">

  <script src="stting_mc.js"></script>
<script src="reminders.js"></script>
  <script>
    // ============================================
    // 🔐 التحقق من التسجيل — مرة واحدة فقط
    // ============================================
    (function checkRegistrationOnce() {
      const VERIFIED_KEY = 'registration_verified';

      if (localStorage.getItem(VERIFIED_KEY) === 'true') {
        console.log('✅ تم التحقق سابقاً — لا حاجة لإعادة الفحص');
        return;
      }

      const hasName = localStorage.getItem('player_name');
      const hasAge  = localStorage.getItem('player_age');

      if (!hasName || !hasAge) {
        console.log('⚠️ لا يوجد تسجيل — تحويل إلى register.html');
        window.location.replace('register.html');
        return;
      }

      localStorage.setItem(VERIFIED_KEY, 'true');
      console.log('✅ تم التحقق بنجاح — لن يُعاد الفحص');
    })();
  </script>

  <script>
    // ============================================
    // 🔧 تسجيل Service Worker
    // ============================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: './' })
          .then(reg => console.log('✅ تم تسجيل SW:', reg.scope))
          .catch(err => console.error('❌ فشل تسجيل SW:', err));
      });
    }
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة الرئيسية — حديث</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg-page: #f0e8d8;
      --text-color: #1b3a1f;
      --frame-color: #2e7d32;
      --frame-height: 50px;
      --frame-text: #ffffff;
      --btn-bg: #2e7d32;
      --btn-text: #ffffff;
      --btn-hover: #1b5e20;
      --btn-shadow: rgba(46,125,50,0.35);
      --btn-shadow-hover: rgba(46,125,50,0.45);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg-page: #121a16;
      --text-color: #edf4ef;
      --frame-color: #205536;
      --btn-bg: #286344;
      --btn-hover: #205536;
      --btn-shadow: rgba(40,99,68,0.35);
      --btn-shadow-hover: rgba(40,99,68,0.45);
    }

    html, body { height: 100%; margin: 0; }

    body {
      min-height: 100vh;
      background: var(--bg-page);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* ====== الخلفية المتحركة ====== */
    .animated-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: linear-gradient(135deg, #f0e8d8 0%, #e8dcc8 50%, #f0e8d8 100%);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
    }

    html[data-theme="dark"] .animated-bg {
      background: linear-gradient(135deg, #121a16 0%, #1b2920 50%, #121a16 100%);
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 🫧 الفقاعات الصاعدة */
    .animated-bg .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(50, 150, 50, 0.08);
      animation: floatUp linear infinite;
      will-change: transform;
      z-index: 0;
    }

    @keyframes floatUp {
      0%   { transform: translateY(100vh) scale(0.9); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-20vh) scale(2); opacity: 0; }
    }

    .top-frame {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--frame-height);
      background: var(--frame-color);
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
      box-shadow: 0 3px 12px rgba(0,0,0,0.2);
    }
    .frame-title {
      font-size: 16px; font-weight: 700;
      color: var(--frame-text);
      letter-spacing: 0.5px;
    }

    .bottom-frame {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--frame-height);
      background: var(--frame-color);
      z-index: 999;
      box-shadow: 0 -3px 12px rgba(0,0,0,0.2);
    }

    .main-wrapper {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(var(--frame-height) + 80px) 24px calc(var(--frame-height) + 40px);
      min-height: 100vh;
    }

    .app-title {
      font-size: 36px;
      font-weight: 800;
      color: var(--frame-color);
      letter-spacing: -0.5px;
      line-height: 1.3;
      text-align: center;
      text-shadow: 0 2px 10px rgba(46,125,50,0.15);
      animation: titleFadeIn 1s ease-out;
      margin-top: 40px;
      width: 100%;
      max-width: 460px;
    }

    @keyframes titleFadeIn {
      from { opacity: 0; transform: translateY(-30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bottom-section {
      position: relative;
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 20px;
      margin-bottom: 80px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .main-btn {
      width: 100%;
      padding: 18px 28px;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
      background: var(--btn-bg);
      color: var(--btn-text);
      box-shadow: 0 8px 20px var(--btn-shadow);
    }

    .main-btn:hover {
      background: var(--btn-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 28px var(--btn-shadow-hover);
    }

    .main-btn:active {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px var(--btn-shadow);
    }

    .main-btn .icon {
      font-size: 22px;
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .main-btn:hover .icon { transform: scale(1.15); }

    .main-btn::before {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: left 0.6s ease;
    }
    .main-btn:hover::before { left: 100%; }

    @media (max-width: 480px) {
      .app-title { font-size: 28px; margin-top: 30px; }
      .main-btn { padding: 16px 22px; font-size: 16px; border-radius: 14px; }
      .main-btn .icon { font-size: 20px; }
      .bottom-section { margin-bottom: 60px; }
    }

    @media (max-width: 360px) {
      .app-title { font-size: 24px; margin-top: 20px; }
      .main-btn { padding: 14px 18px; font-size: 15px; }
      .bottom-section { margin-bottom: 50px; }
    }

    @media (max-height: 700px) {
      .app-title { font-size: 30px; margin-top: 20px; }
      .bottom-section { margin-bottom: 50px; }
    }

    @media (max-height: 600px) {
      .app-title { font-size: 26px; margin-top: 10px; }
      .bottom-section { margin-bottom: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .animated-bg .bubble,
      .animated-bg,
      .app-title { animation: none !important; }
    }
  </style>
</head>
<body>

<!-- 🔊 صوت الأزرار -->
<audio id="clickSound" src="sound/buttem.mp3" preload="auto"></audio>

<!-- الخلفية المتحركة -->
<div class="animated-bg" id="animatedBg"></div>

<div class="top-frame">
  <div class="frame-title">📚 تطبيق حديث</div>
</div>

<div class="main-wrapper">

  <h1 class="app-title">📚 تطبيق حديث</h1>

  <div class="bottom-section">

    <div class="buttons">
      <button class="main-btn" id="startBtn">
        <span class="icon">▶️</span>
        <span>ابدأ التعلم</span>
      </button>

      <button class="main-btn" id="profileBtn">
        <span class="icon">👤</span>
        <span>الملف الشخصي</span>
      </button>

      <button class="main-btn" id="settingsBtn">
        <span class="icon">⚙️</span>
        <span>الإعدادات</span>
      </button>
    </div>

  </div>

</div>

<div class="bottom-frame"></div>

<script>
/* ============================================================
   🔊 صوت الأزرار — جميع الأزرار
   ============================================================ */
(function () {
  function initButtonSound() {
    const clickSound = document.getElementById('clickSound');
    if (!clickSound) {
      console.warn('⚠️ عنصر clickSound غير موجود');
      return;
    }

    document.addEventListener('click', function (e) {
      const btn = e.target.closest('button');
      if (!btn) return;
      if (btn.disabled) return;

      try {
        clickSound.pause();
        clickSound.currentTime = 0;
        const p = clickSound.play();
        if (p && p.catch) {
          p.catch(function (err) {
            console.warn('تعذر تشغيل صوت الزر:', err);
          });
        }
      } catch (err) {
        console.warn('خطأ في تشغيل الصوت:', err);
      }
    }, true);
  }

  if (document.readyState === 'complete') {
    initButtonSound();
  } else {
    window.addEventListener('load', initButtonSound);
  }
})();

/* ============================================================
   🎨 الخلفية المتحركة (فقاعات فقط)
   — تم حذف الدوائر النابضة والأشكال (المربعات)
   ============================================================ */
function createAnimatedBackground() {
  const bg = document.getElementById("animatedBg");

  // 📱 تحديد إذا كان الجهاز جوال (عرض < 768px)
  const isMobile = window.matchMedia('(max-width: 768px)').matches;

  // 📊 عدد الفقاعات فقط
  const BUBBLES_COUNT = isMobile ? 10 : 22;

  // 🫧 فقاعات صاعدة
  for (let i = 0; i < BUBBLES_COUNT; i++) {
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const size = 40 + Math.random() * 70;             // أحجام 40–110px
    const duration = 14 + Math.random() * 16;
    bubble.style.width = size + "px";
    bubble.style.height = size + "px";
    bubble.style.left = Math.random() * 100 + "%";
    bubble.style.animationDuration = duration + "s";
    bubble.style.animationDelay = -(Math.random() * duration) + "s";
    bg.appendChild(bubble);
  }
}

/* ============================================================
   🔗 روابط الأزرار
   ============================================================ */
const CONFIG = {
  startUrl:    "stages.html",
  profileUrl:  "profile.html",
  settingsUrl: "settings.html",
};

document.getElementById('startBtn').onclick = () => {
  window.location.href = CONFIG.startUrl;
};

document.getElementById('profileBtn').onclick = () => {
  window.location.href = CONFIG.profileUrl;
};

document.getElementById('settingsBtn').onclick = () => {
  window.location.href = CONFIG.settingsUrl;
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    document.getElementById('startBtn').click();
  }
});

/* ============================================================
   🚀 التشغيل
   ============================================================ */
createAnimatedBackground();

/* 🔄 إعادة بناء الخلفية عند تغيير حجم الشاشة (مع تأخير بسيط) */
let bgResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(bgResizeTimer);
  bgResizeTimer = setTimeout(() => {
    const bg = document.getElementById("animatedBg");
    if (!bg) return;
    bg.innerHTML = "";          // مسح العناصر القديمة
    createAnimatedBackground(); // إعادة البناء بالعدد المناسب
  }, 400);
});

/* ============================================================
   💾 التخزين الدائم + Service Worker
   ============================================================ */
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().then(granted => {
    console.log('💾 التخزين الدائم:', granted ? '✅ ممنوح' : '❌ مرفوض');
  });
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => {
        console.log('✅ Service Worker مسجل:', reg.scope);
        setInterval(() => {
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'KEEP_ALIVE' });
          }
        }, 30000);
      })
      .catch(err => console.error('❌ فشل تسجيل SW:', err));
  });
}

window.addEventListener('online',  () => console.log('🌐 متصل'));
window.addEventListener('offline', () => console.log('📴 غير متصل'));
</script>

</body>
</html>
